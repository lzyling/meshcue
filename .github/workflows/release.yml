name: Release

# A tag is the only trigger. The release is the tag: there is no button here
# that publishes something the repository does not already have a name for.
on:
  push:
    tags: ["v*"]

# Read-only unless a job says otherwise, and only one does.
permissions:
  contents: read

jobs:
  # The plugin package the Claude Code marketplace points at, built from the
  # tag. npm runs here and nowhere near a token that can write: installing the
  # dependencies runs their install scripts, and this job can only read.
  package:
    name: build the plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      # The same build CI runs on every push, with the same skip: the host step
      # needs a global openclaw a runner has no business installing. The build
      # refuses a package whose manifests disagree; the tag has to agree too,
      # because .claude-plugin/marketplace.json names the asset by it.
      - name: build and zip the package
        env:
          MESHCUE_SKIP_HOST_BUILD: "1"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$declared" != "$version" ]; then
            echo "::error::$GITHUB_REF_NAME is not the version package.json declares ($declared)" >&2
            exit 1
          fi
          npm run build:integration -- tmp/release-package
          (cd tmp/release-package && zip -r -X -q "../meshcue-$version.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: tmp/meshcue-*.zip
          if-no-files-found: error
          retention-days: 1

  # The only job in this repository that writes anything: it creates a release
  # object and attaches the package it was handed, and that is the whole list.
  release:
    name: publish the tag as a release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes come from the tag's own annotation, so the tag object has
          # to be fetched, not just the commit it points at.
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: package
          path: ${{ runner.temp }}/package
      # gh is preinstalled on the runner, so the token stays inside a first
      # party tool: no third-party action is handed a credential to create a
      # release with. The repository's own GITHUB_TOKEN expires with the job.
      - name: create the release from the tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # checkout leaves refs/tags/<tag> pointing straight at the commit, so
          # asking for the tag message here returns the commit message instead,
          # with nothing to say it did — which is what 1.0.1 published. Fetch
          # the tag object itself and refuse to continue if it is not one.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "$(git rev-parse "$tag")")" != "tag" ]; then
            echo "::error::$tag is not an annotated tag; its notes would silently be the commit message" >&2
            exit 1
          fi
          notes="$(git tag -l --format='%(contents:body)' "$tag")"
          # A tag written as one line has a subject and no body; use it rather
          # than publishing a release with nothing in it.
          if [ -z "${notes// /}" ]; then
            notes="$(git tag -l --format='%(contents:subject)' "$tag")"
          fi
          # README tells the reader that every release states the commit it was
          # cut from, so that a moved tag is visible. Append it here rather than
          # trusting whoever writes the next annotation to remember.
          commit="$(git rev-parse "$tag^{commit}")"
          {
            printf '%s\n\n' "$notes"
            printf 'This release is commit %s.\n' "$commit"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" \
            --title "MeshCue ${tag#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "$RUNNER_TEMP/package/meshcue-${tag#v}.zip"
