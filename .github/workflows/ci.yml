name: CI

on:
  push:
  pull_request:

# A pull request from a fork runs that fork's code here. It gets a read-only
# token by default, but "by default" is a repository setting somebody can
# change, so the workflow states what it needs instead of inheriting it.
# Nothing in either job writes to the repository.
permissions:
  contents: read

# Actions are pinned to the commit a tag pointed at, not the tag. A tag is a
# name its owner can move, so @v4 means "whatever that account publishes next",
# which is the supply-chain hole this file would otherwise open on our behalf.
# The comment says which release each SHA was, so upgrading stays readable.
jobs:
  checks:
    name: i18n, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The suites publish real fixture models, and those are generated, not
      # committed. Without this step 29 unit tests and the whole browser suite
      # fail on "fixture model failed to publish" — which is what every run
      # since the workflow was added actually did.
      - run: npm run samples
      - run: npm run check:i18n
      - run: npm run format:check
      - run: node --test tests/*.test.mjs
      - name: check commit messages and tag annotations
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="$PUSH_BEFORE"
          head=HEAD
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          fi
          if [ -n "$base" ] && [[ ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null && git cat-file -e "$head^{commit}" 2>/dev/null; then
            node scripts/privacy-check.mjs --range "$base..$head"
          else
            # First pushes or unavailable event objects: check HEAD itself.
            git log -1 --format=%B HEAD > "$RUNNER_TEMP/privacy-message.txt"
            node scripts/privacy-check.mjs --message "$RUNNER_TEMP/privacy-message.txt"
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              node scripts/privacy-check.mjs --range HEAD^..HEAD
            fi
          fi
      # The version lives in three manifests and only this build compares them.
      # 0.13.1 shipped with the authoritative one left behind at 0.13.0, so the
      # release could not be packaged at all and nothing said so for a day.
      # tests/package-smoke.mjs cannot run here — it needs the host SDK from a
      # global openclaw install — but the build that catches the drift can.
      # The host plugin build needs a global openclaw, which a runner has no
      # business installing; everything this step is here to catch -- the
      # packaging, the version guard across all four manifests, and reading the
      # four documents back out of the output -- runs before it.
      - run: npm run build:integration -- tmp/ci-package
        env:
          MESHCUE_SKIP_HOST_BUILD: "1"
      # A dependency with a published fix and nobody watching is the ordinary
      # way this kind of project gets compromised. Advisory-only: it reports
      # what is known now, and says so out loud rather than failing a build on
      # somebody else's publishing schedule.
      - run: npm audit --audit-level=high
        continue-on-error: true

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run samples
      # playwright.config.js asks for channel "chrome", so the bundled
      # chromium is not enough: the run needs real Google Chrome.
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-output
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

# test:lan is deliberately absent. It needs a real LAN interface and a second
# device to reach the server, which no hosted runner has; the suite already
# skips that case rather than pretending to cover it.
