name: Feature request
description: Something the review loop cannot express today.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: Describe the modelling situation, not the feature. The situation is what decides whether a feature is the right answer.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do instead today
      description: Including "nothing, I gave up" — that is useful to know.
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Which side would change
      options:
        - The review page a person looks at
        - The actions an agent can take
        - Both
        - Not sure
    validations:
      required: true
